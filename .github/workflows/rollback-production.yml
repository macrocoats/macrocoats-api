name: Rollback production

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character commit SHA to redeploy
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://api.macrocoats.in/health
    concurrency:
      group: macrocoats-api-production
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate rollback request
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "ROLLBACK" ]]; then
            echo 'Confirmation must exactly match ROLLBACK.' >&2
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'target_sha must be a full lowercase 40-character Git SHA.' >&2
            exit 1
          fi
          git cat-file -e "${TARGET_SHA}^{commit}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install "ansible-core~=2.19.0"

      - name: Configure production credentials
        shell: bash
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          ANSIBLE_VAULT_FILE_B64: ${{ secrets.ANSIBLE_VAULT_FILE_B64 }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OCI_SSH_PRIVATE_KEY"
          test -n "$OCI_SSH_KNOWN_HOSTS"
          test -n "$ANSIBLE_VAULT_FILE_B64"
          test -n "$ANSIBLE_VAULT_PASSWORD"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/macrocoats-oci.key"
          chmod 600 "$HOME/.ssh/macrocoats-oci.key"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s' "$ANSIBLE_VAULT_FILE_B64" | base64 --decode > ansible/group_vars/vault.yml
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > ansible/.vault_pass.txt
          chmod 600 ansible/group_vars/vault.yml ansible/.vault_pass.txt

      - name: Capture current production SHA
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(ssh -i "$HOME/.ssh/macrocoats-oci.key" ubuntu@92.4.91.25 \
            'cd /var/www/macrocoats-api && git rev-parse HEAD')"
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not capture a valid production SHA" >&2
            exit 1
          fi
          printf 'current_sha=%s\n' "$current_sha" >> "$GITHUB_OUTPUT"

      - name: Redeploy selected commit
        working-directory: ansible
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: ansible-playbook deploy.yml -e "repo_version=${TARGET_SHA}" -e force_deploy=true

      - name: Verify rolled-back service and commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          remote_sha="$(ssh -i "$HOME/.ssh/macrocoats-oci.key" ubuntu@92.4.91.25 \
            'sudo systemctl is-active macrocoats-api >/dev/null && cd /var/www/macrocoats-api && git rev-parse HEAD')"
          if [[ "$remote_sha" != "$TARGET_SHA" ]]; then
            echo "Production SHA mismatch: expected $TARGET_SHA, found $remote_sha" >&2
            exit 1
          fi
          health="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --retry-all-errors https://api.macrocoats.in/health)"
          jq -e '.status == "ok" and .checks.db == "ok" and .checks.redis != "down"' <<< "$health" >/dev/null
          ssh -i "$HOME/.ssh/macrocoats-oci.key" ubuntu@92.4.91.25 \
            'sudo journalctl -u macrocoats-api -n 50 --no-pager'

      - name: Publish rollback summary
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          REPLACED_SHA: ${{ steps.checkpoint.outputs.current_sha }}
          ROLLBACK_STATUS: ${{ job.status }}
        run: |
          {
            echo "## macrocoats-api production rollback"
            echo
            echo "- Status: ${ROLLBACK_STATUS}"
            echo "- Requested target: \`${TARGET_SHA}\`"
            echo "- Replaced SHA: \`${REPLACED_SHA:-not captured}\`"
            echo "- Database migrations were not reversed."
            echo "- Health URL: https://api.macrocoats.in/health"
          } >> "$GITHUB_STEP_SUMMARY"
