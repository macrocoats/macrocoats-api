---
domain: api.macrocoats.in
cookie_domain: .macrocoats.in
frontend_origin: "https://portal.macrocoats.in"
certbot_email: aswin@macrocoats.in
certbot_webroot: /var/www/certbot-webroot

app_user: "{{ ansible_user }}"
app_dir: /var/www/macrocoats-api
repo_url: git@github.com:macrocoats/macrocoats-api.git
repo_version: main

node_version: "20"
install_redis: true

db_name: macrocoats
db_user: macrocoats
# db_password comes from vault.yml

# Where production data lives:
#   local    — PostgreSQL on this host (postgres role), DATABASE_URL via localhost
#   supabase — Supabase project macrocoats-portal (ap-south-1), via its IPv4 session
#              pooler; DATABASE_URL is vault_supabase_database_url. See README
#              "Supabase cutover" before flipping this — the data must be copied first.
database_mode: local

app_database_url: >-
  {{ vault_supabase_database_url if database_mode == 'supabase'
     else 'postgresql://' ~ db_user ~ ':' ~ vault_db_password ~ '@localhost:5432/' ~ db_name }}

# App pool size (DB_POOL_MAX). Supabase's session pooler gives each client
# connection its own server connection, so stay under the project's pool size.
db_pool_max: "{{ 10 if database_mode == 'supabase' else 20 }}"

# pg_dump major version used for backups in supabase mode — must be >= the
# Supabase server version (17.x) or pg_dump refuses to dump it.
supabase_pg_client_version: "17"

# Hourly one-way copy local → Supabase (roles/supabase-replica) while
# database_mode=local: a warm standby and off-host backup, at most an hour old.
# Needs vault_supabase_database_url; removed automatically in supabase mode.
supabase_replica_enabled: true
supabase_replica_minute: "17"   # off the hour, away from the 02:30 nightly backup

api_port: 3001

# OCI control-plane resources (used by roles/oci-network, roles/oci-monitoring —
# requires oracle.oci collection + ~/.oci/config, not SSH). Fetch/update via
# `oci network security-list get` / `oci network nsg list` if the instance/subnet/
# VCN topology ever changes, or the `oci ons`/`oci health-checks`/`oci monitoring`
# equivalents for the monitoring resources.
oci_compartment_id: ocid1.tenancy.oc1..aaaaaaaac6nlrz32jcnx6bn5dleijje2bt6dc6pfciujlgbjiebk7e3pacya
oci_security_list_id: ocid1.securitylist.oc1.ap-mumbai-1.aaaaaaaanqwef2xrykinvrthmvm4ui6jhg5mwqcdjgdjpeik6ql56vnfvvyq
oci_nsg_id: ocid1.networksecuritygroup.oc1.ap-mumbai-1.aaaaaaaawvp4ekb4efv2brccpqgcxr7w7izctb42pvefxby432iyu4vrovoq

oci_monitoring_topic_id: ocid1.onstopic.oc1.ap-mumbai-1.amaaaaaaycctwiiatr7upgpycs3dzlemipittvuwb3lexledzu4hsefgwlpq
oci_monitoring_subscription_id: ocid1.onssubscription.oc1.ap-mumbai-1.aaaaaaaaraamwslbifd2qlsb27osxxribudhfgwghyr6m2rqivmnx3aglccq
oci_monitoring_http_monitor_id: ocid1.httpmonitor.oc1.ap-mumbai-1.aaaaaaaakx3h6v7f2qr7e4mfjo7zezi2n5hf6ea5stq7jakw5pknbwngmi5q
oci_monitoring_alarm_id: ocid1.alarm.oc1.ap-mumbai-1.amaaaaaaycctwiias4iporzrwi7wddmfv5slx65rig6hnojmcmayn2elwnga
