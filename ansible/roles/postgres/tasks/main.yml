---
- name: Install PostgreSQL
  apt:
    name:
      - postgresql
      - postgresql-contrib
    state: present

- name: Ensure PostgreSQL is running and enabled
  systemd:
    name: postgresql
    state: started
    enabled: true

- name: Create app database role
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ vault_db_password }}"
    role_attr_flags: LOGIN
    state: present

- name: Create app database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    state: present

- name: Confirm PostgreSQL only listens on localhost (default — do not expose 5432)
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ ansible_facts.postgresql_version | default('14') }}/main/postgresql.conf
    line: "listen_addresses = 'localhost'"
    regexp: "^#?listen_addresses"
  notify: restart postgresql
  ignore_errors: true # path varies by pg version; verify manually if this doesn't match

# The backup script and its cron job live in roles/db-backup (they follow database_mode).
