---
# Prerequisite: the SSH key used to connect to this host (or an agent-forwarded key)
# must be registered as a deploy key with read access on git@github.com:macrocoats/macrocoats-api.git

# ── database_mode guard ─────────────────────────────────────────────────────
# Switching where the live data is (local ↔ supabase) is only safe right after the
# data has been copied (scripts/cutover-to-supabase.sh, which passes
# allow_db_mode_change=true). Without this, a routine deploy from a branch that
# still says database_mode=local would quietly point production back at the
# stale local database after the cutover — and vice versa.
- name: Read the currently deployed .env
  ansible.builtin.slurp:
    src: "{{ app_dir }}/.env"
  register: current_env
  failed_when: false
  no_log: true

- name: Refuse an unplanned database_mode change
  vars:
    deployed_mode: >-
      {{ 'supabase' if (current_env.content is defined
                        and 'pooler.supabase.com' in (current_env.content | b64decode))
         else ('local' if current_env.content is defined else 'none') }}
  ansible.builtin.assert:
    that: deployed_mode in ['none', database_mode] or (allow_db_mode_change | default(false) | bool)
    fail_msg: >-
      Production currently uses database_mode={{ deployed_mode }} but this deploy says
      database_mode={{ database_mode }}. Use scripts/cutover-to-supabase.sh for a planned
      switch, or pass -e allow_db_mode_change=true for a deliberate rollback.
    quiet: true

- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Checkout application code
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_version }}"
    accept_hostkey: true
  become: true
  become_user: "{{ app_user }}"
  register: checkout

- name: Decide whether this release must be applied
  ansible.builtin.set_fact:
    deploy_required: "{{ checkout.changed or (force_deploy | default(false) | bool) }}"

- name: Check whether dependencies are already installed
  ansible.builtin.stat:
    path: "{{ app_dir }}/node_modules/.package-lock.json"
  register: installed_dependencies

- name: Check whether the dependency lockfile changed
  ansible.builtin.command:
    argv:
      - git
      - diff
      - --quiet
      - "{{ checkout.before }}"
      - "{{ checkout.after }}"
      - --
      - package-lock.json
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ app_user }}"
  register: dependency_lockfile_diff
  changed_when: false
  failed_when: dependency_lockfile_diff.rc not in [0, 1]
  when:
    - deploy_required
    - checkout.before is defined
    - checkout.before | length > 0
    - checkout.after is defined
    - checkout.after | length > 0

- name: Decide whether dependencies must be installed
  ansible.builtin.set_fact:
    dependency_install_required: >-
      {{
        not installed_dependencies.stat.exists
        or checkout.before is not defined
        or (checkout.before | default('') | length == 0)
        or (dependency_lockfile_diff.rc | default(1)) == 1
      }}
  when: deploy_required

- name: Install dependencies (npm ci)
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ app_user }}"
  when:
    - deploy_required
    - dependency_install_required

- name: Verify the CI artifact belongs to the requested release
  ansible.builtin.assert:
    that:
      - release_artifact_sha is defined
      - release_artifact_sha == repo_version
    fail_msg: The release artifact SHA must match repo_version.
  when:
    - deploy_required
    - release_artifact is defined

- name: Remove the previous compiled application
  ansible.builtin.file:
    path: "{{ app_dir }}/dist"
    state: absent
  when:
    - deploy_required
    - release_artifact is defined

- name: Install the tested production build
  ansible.builtin.unarchive:
    src: "{{ release_artifact }}"
    dest: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
  when:
    - deploy_required
    - release_artifact is defined
  notify: restart macrocoats-api

- name: Build on the target when no CI artifact was supplied
  # Incident 2026-07-22: npm ci + this build, run directly on the live
  # VM.Standard.E2.1.Micro (1GB RAM, no swap at the time) alongside the running
  # app/Postgres/Redis/nginx, exhausted memory hard enough to make the whole
  # instance — including sshd — unresponsive for ~10 minutes, tripping the
  # uptime alarm. Fixed by adding 2GB swap (roles/common) as a safety net; still
  # worth watching `free -h` during a deploy on this box, or moving the build
  # off-box (build locally/CI, rsync dist/) if it recurs.
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ app_user }}"
  when:
    - deploy_required
    - release_artifact is not defined
  notify: restart macrocoats-api

- name: Ensure procurement storage directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}/company-documents"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Write .env (secrets from vault.yml — keep this file vault-encrypted)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  no_log: true
  notify: restart macrocoats-api

- name: Symlink .env.local -> .env
  # db:migrate / db:reset / seed / db:generate / db:studio all hardcode --env-file=.env.local
  # (see macrocoats-api/CLAUDE.md "Environment setup") — this makes those scripts work
  # unmodified in production without duplicating secrets into a second file.
  ansible.builtin.file:
    src: "{{ app_dir }}/.env"
    dest: "{{ app_dir }}/.env.local"
    state: link
    owner: "{{ app_user }}"
    group: "{{ app_user }}"

- name: Install systemd unit
  ansible.builtin.template:
    src: macrocoats-api.service.j2
    dest: /etc/systemd/system/macrocoats-api.service
    mode: "0644"
  notify:
    - reload systemd
    - restart macrocoats-api

# Ask the database rather than diffing git: a retry after a failed migration has
# no git diff but still has work pending. Same test as drizzle's own migrator — a
# migration applies only if its journal `when` is newer than the latest created_at.
- name: Read the migration journal
  ansible.builtin.slurp:
    src: "{{ app_dir }}/src/db/migrations/meta/_journal.json"
  register: migration_journal
  when: deploy_required

- name: Read the latest migration applied to the database
  ansible.builtin.command:
    cmd: >-
      psql "$DATABASE_URL" -tAc
      "SELECT created_at FROM drizzle.__drizzle_migrations ORDER BY created_at DESC LIMIT 1"
  environment:
    DATABASE_URL: "{{ app_database_url }}"
  become: true
  become_user: "{{ app_user }}"
  register: latest_applied_migration
  when: deploy_required
  changed_when: false
  failed_when: false
  no_log: true

- name: Decide whether migrations are pending
  # Any failed or empty lookup (e.g. a brand-new database) counts as pending, so
  # db:migrate still runs and reports a real problem itself.
  ansible.builtin.set_fact:
    migrations_pending: >-
      {{
        latest_applied_migration.rc != 0
        or (latest_applied_migration.stdout | trim | length == 0)
        or ((migration_journal.content | b64decode | from_json).entries
            | map(attribute='when') | map('int') | max)
           > (latest_applied_migration.stdout | trim | int)
      }}
  when: deploy_required

- name: Create a pre-migration database backup
  ansible.builtin.command:
    cmd: /usr/local/bin/backup-macrocoats-db.sh
  when:
    - deploy_required
    - migrations_pending
  changed_when: true

- name: Run database migrations
  ansible.builtin.command:
    cmd: npm run db:migrate
    chdir: "{{ app_dir }}"
  environment:
    DATABASE_URL: "{{ app_database_url }}"
  become: true
  become_user: "{{ app_user }}"
  when:
    - deploy_required
    - migrations_pending
  no_log: true

- name: Keep the Supabase Data API closed over the portal's tables (incl. ones just migrated)
  ansible.builtin.command:
    cmd: psql "$DATABASE_URL" -q -f scripts/supabase-lockdown.sql
    chdir: "{{ app_dir }}"
  environment:
    DATABASE_URL: "{{ app_database_url }}"
  become: true
  become_user: "{{ app_user }}"
  when: deploy_required and database_mode == 'supabase'
  changed_when: false
  no_log: true

- name: Apply the new service configuration after migrations succeed
  ansible.builtin.meta: flush_handlers

- name: Run seed data (idempotent — only when explicitly requested)
  ansible.builtin.command:
    cmd: npm run seed
    chdir: "{{ app_dir }}"
  environment:
    DATABASE_URL: "{{ app_database_url }}"
  become: true
  become_user: "{{ app_user }}"
  tags: [seed, never]
  no_log: true

- name: Enable and start the app service
  ansible.builtin.systemd:
    name: macrocoats-api
    state: started
    enabled: true

- name: Wait for the API and its dependencies to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ api_port }}/health"
    method: GET
    status_code: 200
    return_content: true
  register: api_health
  until:
    - (api_health.status | default(0)) == 200
    - (api_health.json | default({})).get('status') == "ok"
    - (api_health.json | default({})).get('checks', {}).get('db') == "ok"
    - (api_health.json | default({})).get('checks', {}).get('redis') != "down"
  retries: 12
  delay: 5
